name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish KppBlazor.csproj -c Release -o release --nologo

      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/kpp/" />|g' release/wwwroot/index.html
      - name: Compress framework files with Gzip
        run: |
          cd release/wwwroot/_framework
          for f in $(find . -type f \( -name '*.dll' -o -name '*.wasm' -o -name '*.dat' \)); do
            gzip -k -9 "$f" 2>/dev/null || true
          done
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll
      - name: Create secrets.json from GitHub Secrets
        run: |
          cat > release/wwwroot/secrets.json << EOF
          {
            "openRouterKey": "${{ secrets.OPENROUTER_KEY }}",
            "visionApiKey": "${{ secrets.GEMINI_API_KEY }}",
            "proxyUrl": "https://kpp-gemini-proxy.qaidarq1307.workers.dev"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
