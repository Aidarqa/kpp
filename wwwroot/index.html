<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌐 КПП — Контроль гостей</title>
    <base href="/kpp/" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#07111f;color:#7899bb;font-family:Segoe UI,sans-serif">
            <div style="text-align:center">
                <div style="font-size:48px;margin-bottom:16px">🌐</div>
                <div style="font-size:16px">Загрузка КПП...</div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        Произошла непредвиденная ошибка.
        <a href="" class="reload">Перезагрузить</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.viewDoc = function (dataUrl) {
            var win = window.open('', '_blank');
            if (!win) return;
            var isImg = dataUrl.startsWith('data:image');
            win.document.write(
                '<html><head><title>Документ</title></head>' +
                '<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh">' +
                (isImg
                    ? '<img src="' + dataUrl + '" style="max-width:100%;max-height:100vh;object-fit:contain"/>'
                    : '<iframe src="' + dataUrl + '" style="width:100vw;height:100vh;border:none"></iframe>') +
                '</body></html>'
            );
        };
    </script>
</body>
</html>
