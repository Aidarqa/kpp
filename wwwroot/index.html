<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПП — Контроль гостей</title>
    <base href="/kpp/" />
    <link rel="icon" type="image/svg+xml" href="icons/kpp.svg" />
    <link rel="stylesheet" href="css/site.css" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Система контроля и учёта посетителей на КПП" />
    <style>
        /* Loading screen styles — inline to avoid CSS dependency */
        @keyframes loadGlow  { 0%,100%{box-shadow:0 0 20px rgba(6,182,212,0.15);} 50%{box-shadow:0 0 40px rgba(6,182,212,0.3);} }
        #loading-screen {
            display:flex;align-items:center;justify-content:center;min-height:100vh;
            background:#030712;color:#94a3b8;font-family:Inter,Segoe UI,sans-serif;
            position:fixed;inset:0;z-index:9999;transition:opacity .4s ease;
        }
        #loading-screen.fade-out { opacity:0; pointer-events:none; }
        .load-wrap { text-align:center;max-width:320px;width:100%;padding:0 24px; }
        .load-logo {
            width:56px;height:56px;margin:0 auto 20px;
            background:linear-gradient(135deg,#06b6d4,#8b5cf6);
            border-radius:16px;display:flex;align-items:center;justify-content:center;
            animation:loadGlow 3s ease-in-out infinite;
        }
        .load-logo svg { width:28px;height:28px;color:white; }
        .load-title { font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:4px; }
        .load-sub { font-size:12px;color:#64748b;margin-bottom:20px;font-weight:500; }
        .load-bar-bg {
            width:100%;height:4px;background:rgba(148,163,184,0.1);
            border-radius:4px;overflow:hidden;margin-bottom:10px;
        }
        .load-bar-fill {
            height:100%;width:0%;border-radius:4px;
            background:linear-gradient(90deg,#06b6d4,#8b5cf6);
            transition:width .3s ease;
        }
        .load-pct { font-size:11px;color:#64748b;font-weight:600;font-variant-numeric:tabular-nums; }
    </style>
</head>
<body>
    <!-- Loading screen (shown before Blazor boots) -->
    <div id="loading-screen">
        <div class="load-wrap">
            <div class="load-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div class="load-title">КПП Контроль гостей</div>
            <div class="load-sub" id="load-status">Загрузка системы...</div>
            <div class="load-bar-bg">
                <div class="load-bar-fill" id="load-bar"></div>
            </div>
            <div class="load-pct" id="load-pct">0%</div>
        </div>
    </div>

    <div id="app"></div>
    <div id="blazor-error-ui">
        Произошла непредвиденная ошибка.
        <a href="" class="reload">Перезагрузить</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- Blazor WASM — autostart=false for loading screen -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        // ═══════════════════════════════════════════════════════
        //  BLAZOR BOOT — with Gzip decompression for GitHub Pages
        // ═══════════════════════════════════════════════════════
        (function () {
            var bar = document.getElementById('load-bar');
            var pctEl = document.getElementById('load-pct');
            var statusEl = document.getElementById('load-status');
            var screen = document.getElementById('loading-screen');

            function setProgress(percent, text) {
                if (bar) bar.style.width = percent + '%';
                if (pctEl) pctEl.textContent = Math.round(percent) + '%';
                if (text && statusEl) statusEl.textContent = text;
            }

            // Check if browser supports DecompressionStream for gzip
            var canDecompress = typeof DecompressionStream !== 'undefined';

            // Simulated progress while Blazor loads
            var fakeProgress = 0;
            var progressInterval = setInterval(function () {
                if (fakeProgress < 85) {
                    fakeProgress += (85 - fakeProgress) * 0.035;
                    setProgress(fakeProgress, 'Загрузка системы...');
                } else {
                    clearInterval(progressInterval);
                }
            }, 300);

            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // CRITICAL: dotnetjs and manifest MUST return a URI string
                    // Returning anything else causes: "custom loaders must supply a URI string"
                    if (type === 'dotnetjs' || type === 'manifest') {
                        return defaultUri;
                    }

                    // For other resources, try gzip-compressed version if browser supports it
                    if (canDecompress) {
                        var gzUri = defaultUri + '.gz';
                        return fetch(gzUri)
                            .then(function (resp) {
                                if (!resp.ok) return null;
                                // Decompress the gzip response
                                var ds = new DecompressionStream('gzip');
                                var decompressed = resp.body.pipeThrough(ds);
                                return new Response(decompressed);
                            })
                            .catch(function () {
                                return null;
                            })
                            .then(function (result) {
                                // If decompression worked, return Response; otherwise use default URI
                                return result || defaultUri;
                            });
                    }

                    // No DecompressionStream — return default URI (uncompressed)
                    return defaultUri;
                }
            }).then(function () {
                clearInterval(progressInterval);
                setProgress(100, 'Готово!');
                setTimeout(function () {
                    if (screen) {
                        screen.classList.add('fade-out');
                        setTimeout(function () { screen.remove(); }, 500);
                    }
                }, 300);
            }).catch(function (err) {
                clearInterval(progressInterval);
                console.error('Blazor boot failed:', err);
                setProgress(0, 'Ошибка загрузки. Обновите страницу.');
            });
        })();

        // ═══════════════════════════════════════════════════════
        //  HELPER FUNCTIONS
        // ═══════════════════════════════════════════════════════
        window.viewDoc = function (dataUrl) {
            var win = window.open('', '_blank');
            if (!win) return;
            var isImg = dataUrl.startsWith('data:image');
            win.document.write(
                '<html><head><title>Документ</title></head>' +
                '<body style="margin:0;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh">' +
                (isImg
                    ? '<img src="' + dataUrl + '" style="max-width:100%;max-height:100vh;object-fit:contain"/>'
                    : '<iframe src="' + dataUrl + '" style="width:100vw;height:100vh;border:none"></iframe>') +
                '</body></html>'
            );
        };

        window.requestNotificationPermission = async function () {
            if (!('Notification' in window)) return false;
            if (Notification.permission === 'granted') return true;
            var result = await Notification.requestPermission();
            return result === 'granted';
        };

        window.sendNotification = function (title, body, icon) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            try {
                new Notification(title, { body: body, icon: icon || '/kpp/icons/kpp.svg' });
            } catch (e) {}
        };

        // ═══════════════════════════════════════════════════════
        //  Passport OCR Engine v3 — Lazy Tesseract + AI Vision + MRZ
        //  Tesseract.js is loaded ONLY when user scans a passport
        // ═══════════════════════════════════════════════════════
        window.passportOcr = {
            _worker: null,
            _tesseractLoaded: false,
            _tesseractLoading: false,

            setProgress: function (pct) {
                var el = document.getElementById('ocr-progress');
                if (el) el.style.width = pct + '%';
            },

            loadTesseract: async function () {
                if (this._tesseractLoaded) return;
                if (this._tesseractLoading) {
                    while (this._tesseractLoading) {
                        await new Promise(function (r) { setTimeout(r, 200); });
                    }
                    return;
                }
                this._tesseractLoading = true;
                this.setProgress(3);

                return new Promise(function (resolve, reject) {
                    var script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                    script.async = true;
                    script.onload = function () {
                        passportOcr._tesseractLoaded = true;
                        passportOcr._tesseractLoading = false;
                        console.log('Tesseract.js loaded lazily');
                        resolve();
                    };
                    script.onerror = function () {
                        passportOcr._tesseractLoading = false;
                        reject(new Error('Failed to load Tesseract.js'));
                    };
                    document.head.appendChild(script);
                });
            },

            getWorker: async function () {
                if (this._worker) return this._worker;
                if (!this._tesseractLoaded) {
                    await this.loadTesseract();
                }
                this.setProgress(5);
                this._worker = await Tesseract.createWorker('rus+eng', 1, {
                    logger: function (m) {
                        if (m.status === 'recognizing text') {
                            var pct = Math.round((m.progress || 0) * 100);
                            passportOcr.setProgress(pct);
                        }
                    }
                });
                return this._worker;
            },

            loadImage: function (dataUrl) {
                return new Promise(function (resolve, reject) {
                    var img = new Image();
                    img.onload = function () { resolve(img); };
                    img.onerror = function () { reject(new Error('Image load failed')); };
                    img.src = dataUrl;
                });
            },

            preprocessImage: function (img, opts) {
                opts = opts || {};
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var maxW = opts.maxWidth || 2400;
                var w = img.width, h = img.height;
                if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                var imageData = ctx.getImageData(0, 0, w, h);
                var data = imageData.data;
                var len = data.length;
                for (var i = 0; i < len; i += 4) {
                    var gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    data[i] = data[i + 1] = data[i + 2] = gray;
                }
                var contrast = opts.contrast || 70;
                var factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                for (var i = 0; i < len; i += 4) {
                    data[i]     = Math.min(255, Math.max(0, factor * (data[i] - 128) + 128));
                    data[i + 1] = Math.min(255, Math.max(0, factor * (data[i + 1] - 128) + 128));
                    data[i + 2] = Math.min(255, Math.max(0, factor * (data[i + 2] - 128) + 128));
                }
                if (opts.binarize !== false) {
                    var histogram = new Array(256).fill(0);
                    var total = len / 4;
                    for (var i = 0; i < len; i += 4) histogram[Math.round(data[i])]++;
                    var sum = 0;
                    for (var t = 0; t < 256; t++) sum += t * histogram[t];
                    var sumB = 0, wB = 0, maxVar = 0, threshold = 128;
                    for (var t = 0; t < 256; t++) {
                        wB += histogram[t];
                        if (wB === 0) continue;
                        var wF = total - wB;
                        if (wF === 0) break;
                        sumB += t * histogram[t];
                        var mB = sumB / wB;
                        var mF = (sum - sumB) / wF;
                        var v = wB * wF * (mB - mF) * (mB - mF);
                        if (v > maxVar) { maxVar = v; threshold = t; }
                    }
                    for (var i = 0; i < len; i += 4) {
                        var v = data[i] > threshold ? 255 : 0;
                        data[i] = data[i + 1] = data[i + 2] = v;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                return canvas;
            },

            cropRegion: function (img, region) {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var sx = Math.round(img.width * (region.x || 0));
                var sy = Math.round(img.height * (region.y || 0));
                var sw = Math.round(img.width * (region.w || 1));
                var sh = Math.round(img.height * (region.h || 1));
                canvas.width = sw;
                canvas.height = sh;
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
                return canvas;
            },

            canvasToDataUrl: function (canvas) {
                return canvas.toDataURL('image/png');
            },

            // ═══ MRZ PARSER ═══

            parseMrz: function (text) {
                var result = { fullName: '', dob: '', passport: '', nationality: '', gender: '' };
                var lines = text.split('\n').map(function (l) { return l.trim(); });
                var mrzLines = [];
                for (var i = 0; i < lines.length; i++) {
                    var clean = lines[i].replace(/[^A-Z0-9<]/g, '');
                    if (clean.length >= 25 && /^[A-Z0-9<]+$/.test(clean)) {
                        mrzLines.push(clean);
                    }
                }
                if (mrzLines.length === 0) {
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].toUpperCase()
                            .replace(/O/g, '0')
                            .replace(/[^A-Z0-9<\s]/g, '')
                            .replace(/\s+/g, '');
                        if (line.length >= 25) mrzLines.push(line);
                    }
                }
                if (mrzLines.length === 0) return result;
                if (mrzLines.length >= 3 && mrzLines[0].length >= 28 && mrzLines[0].length <= 33) {
                    result = this.parseMrzTd1(mrzLines[0], mrzLines[1], mrzLines[2]);
                } else if (mrzLines.length >= 2 && mrzLines[0].length >= 40) {
                    result = this.parseMrzTd3(mrzLines[0], mrzLines[1]);
                } else {
                    var td1 = mrzLines.length >= 3 ? this.parseMrzTd1(mrzLines[0], mrzLines[1], mrzLines[2]) : null;
                    var td3 = mrzLines.length >= 2 ? this.parseMrzTd3(mrzLines[0], mrzLines[1]) : null;
                    if (td1 && td3) {
                        var td1C = (td1.fullName?1:0)+(td1.dob?1:0)+(td1.passport?1:0);
                        var td3C = (td3.fullName?1:0)+(td3.dob?1:0)+(td3.passport?1:0);
                        result = td1C >= td3C ? td1 : td3;
                    } else { result = td1 || td3 || result; }
                }
                return result;
            },

            parseMrzTd1: function (line1, line2, line3) {
                var result = { fullName: '', dob: '', passport: '', nationality: '', gender: '' };
                try {
                    var docNum = line1.substring(5, 14).replace(/</g, '').trim();
                    if (docNum.length >= 6) {
                        var docType = line1.substring(0, 2);
                        result.passport = /ID|AC/i.test(docType) ? docType.toUpperCase() + docNum : docNum;
                    }
                    result.dob = this.parseMrzDate(line2.substring(0, 6));
                    result.gender = line2.charAt(7) === 'F' ? 'Ж' : 'М';
                    result.nationality = this.mrzCountryToName(line2.substring(15, 18).replace(/</g, '').trim());
                    var namePart = line3.replace(/</g, ' ').replace(/\s+/g, ' ').trim();
                    if (namePart) result.fullName = namePart;
                } catch (e) { console.warn('MRZ TD1 parse error:', e); }
                return result;
            },

            parseMrzTd3: function (line1, line2) {
                var result = { fullName: '', dob: '', passport: '', nationality: '', gender: '' };
                try {
                    var docNum = line2.substring(0, 9).replace(/</g, '').trim();
                    if (docNum.length >= 6) result.passport = docNum;
                    result.nationality = this.mrzCountryToName(line2.substring(10, 13).replace(/</g, '').trim());
                    result.dob = this.parseMrzDate(line2.substring(13, 19));
                    result.gender = line2.charAt(20) === 'F' ? 'Ж' : 'М';
                    var nameRaw = line1.substring(5).replace(/</g, ' ').replace(/\s+/g, ' ').trim();
                    if (nameRaw) result.fullName = nameRaw;
                } catch (e) { console.warn('MRZ TD3 parse error:', e); }
                return result;
            },

            parseMrzDate: function (dateStr) {
                if (!dateStr || dateStr.length < 6) return '';
                var yy = parseInt(dateStr.substring(0, 2));
                var mm = dateStr.substring(2, 4);
                var dd = dateStr.substring(4, 6);
                var year = yy > 50 ? 1900 + yy : 2000 + yy;
                var mmi = parseInt(mm); var ddi = parseInt(dd);
                if (mmi < 1 || mmi > 12 || ddi < 1 || ddi > 31) return '';
                return dd + '.' + mm + '.' + year;
            },

            mrzCountryToName: function (code) {
                var map = { 'KGZ':'КР','KG':'КР','KAZ':'KZ','RUS':'РФ','RU':'РФ','UZB':'UZ','TJK':'TJ','TKM':'TM','BLR':'BY','UKR':'UA','CHN':'CN','TUR':'TR','DEU':'DE','USA':'US','GBR':'GB','KOR':'KR','JPN':'JP' };
                return map[code.toUpperCase()] || code.toUpperCase();
            },

            // ═══ FULL-TEXT PASSPORT PARSER ═══

            parsePassportText: function (text) {
                var result = { fullName: '', dob: '', passport: '', nationality: '', gender: '' };
                var lines = text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>1;});
                var fullText = lines.join(' ');

                var passportPatterns = [
                    /(?:серия|series)[:\s]*(\d{2}\s?\d{2})\s*(?:номер|number|№)[:\s]*(\d{6})/i,
                    /ID\s*(\d{7,9})/i,
                    /(?:AN|АN|АМ)\s*(\d{7})/i,
                    /(\d{2}\s?\d{2})\s*(\d{6})/g,
                    /(\d{4})\s*(\d{6})/g,
                    /(\d{2}\s?\d{2}\s?\d{6})/g
                ];
                for (var pi=0; pi<passportPatterns.length; pi++) {
                    passportPatterns[pi].lastIndex = 0;
                    var pm = passportPatterns[pi].exec(fullText);
                    if (pm) {
                        if (pi<=2) { result.passport = pm[0].replace(/\s+/g,' ').trim(); }
                        else { var digits=pm[0].replace(/[^\d]/g,''); if(digits.length>=10) result.passport=digits.substring(0,4)+' '+digits.substring(4,10); else if(digits.length>=6) result.passport=digits; }
                        if (result.passport) break;
                    }
                }

                var namePatterns = [
                    /(?:ф\.?и\.?о\.?|фио|фамилия)[:\s]*([А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+){1,3})/i,
                    /(?:имя|name)[:\s]*([А-ЯЁA-Z][а-яёa-z]+(?:\s+[А-ЯЁA-Z][а-яёa-z]+){0,2})/i
                ];
                for (var ni=0; ni<namePatterns.length; ni++) {
                    var nm = namePatterns[ni].exec(fullText);
                    if (nm) { var words=nm[1].trim().split(/\s+/); if(words.length>=2&&words.length<=4){result.fullName=nm[1].trim();break;} }
                }
                if (!result.fullName) {
                    var skipWords = /паспорт|серия|номер|дата|выдан|код|подраздел|РОССИ|КЫРГЫЗ|KYRGYZ|RUSSIAN|РЕСПУБЛИК|ГОСУДАРСТВ|МИНИСТЕРСТВ|ГРАЖДАНСТВ|ПОЛ|МУЖ|ЖЕН|СТРАНА/i;
                    for (var li=0;li<lines.length;li++) {
                        var line=lines[li]; if(/^\d/.test(line))continue; if(skipWords.test(line))continue;
                        var cyrillicWords=line.match(/[А-ЯЁ][а-яё]+/g);
                        if(cyrillicWords&&cyrillicWords.length>=2&&cyrillicWords.length<=4){result.fullName=cyrillicWords.join(' ');break;}
                    }
                }

                var dobPatterns = [
                    /(?:дата\s*рожд|род\.?|born|DOB|date\s*of\s*birth)[:\s]*(\d{1,2}[\.\/\-]\d{1,2}[\.\/\-]\d{2,4})/i,
                    /(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{4})/g
                ];
                for (var di=0;di<dobPatterns.length;di++) {
                    dobPatterns[di].lastIndex=0;
                    var dm=dobPatterns[di].exec(fullText);
                    if(dm){var dateStr=(dm[1]||'')+(dm.length>3?'.'+dm[2]+'.'+dm[3]:dm[0]);if(di===0)dateStr=dm[1]||dm[0];dateStr=dateStr.replace(/[\/\-]/g,'.');var parts=dateStr.split('.');if(parts.length===3){var day=parts[0].padStart(2,'0');var month=parts[1].padStart(2,'0');var year=parseInt(parts[2]);if(year>1900&&year<2016){result.dob=day+'.'+month+'.'+year;break;}}}
                }

                var natPatterns = [
                    /(?:гражданств|nationality|citizen)[:\s]*(РФ|Российск[а-яё]+\s+Федераци[яи]|Кыргызск[а-яё]+\s+Республик[аи]|КР|КЫРГЫЗСТАН|КИРГИЗИЯ)/i,
                    /\b(КЫРГЫЗСКАЯ\s+РЕСПУБЛИКА|КЫРГЫЗ\s+РЕСПУБЛИКАСЫ|КЫРГЫЗСТАН|РОССИЙСКАЯ\s+ФЕДЕРАЦИЯ|РОССИЯ|РФ|КР|УЗБЕКИСТАН|КАЗАХСТАН|ТАДЖИКИСТАН)\b/i
                ];
                for (var nai=0;nai<natPatterns.length;nai++) {
                    var nam=natPatterns[nai].exec(fullText);
                    if(nam){result.nationality=nam[1].toUpperCase();if(result.nationality.indexOf('РОССИЙСК')>=0||result.nationality==='РОССИЯ')result.nationality='РФ';if(result.nationality.indexOf('КЫРГЫЗ')>=0||result.nationality==='КЫРГЫЗСТАН')result.nationality='КР';if(result.nationality==='КАЗАХСТАН')result.nationality='KZ';if(result.nationality==='УЗБЕКИСТАН')result.nationality='UZ';if(result.nationality==='ТАДЖИКИСТАН')result.nationality='TJ';break;}
                }

                if(/\bМ\b|МУЖ|MALE/i.test(fullText))result.gender='М';
                else if(/\bЖ\b|ЖЕН|FEMALE/i.test(fullText))result.gender='Ж';
                return result;
            },

            // ═══ AI VISION API ═══

            scanWithAiVision: async function (dataUrl) {
                var aiConfig = window.__kppOcrConfig || {};
                var baseUrl = aiConfig.visionApiUrl || '';
                if (!baseUrl) { console.log('AI Vision: no endpoint configured, skipping'); return null; }
                var apiKey = aiConfig.visionApiKey || '';
                var token = aiConfig.visionApiToken || '';
                var chatId = aiConfig.visionApiChatId || '';
                var userId = aiConfig.visionApiUserId || '';
                try {
                    var url = baseUrl + '/chat/completions/vision';
                    var headers = { 'Content-Type':'application/json','Authorization':'Bearer '+apiKey,'X-Z-AI-From':'Z' };
                    if (chatId) headers['X-Chat-Id'] = chatId;
                    if (token) headers['X-Token'] = token;
                    if (userId) headers['X-User-Id'] = userId;
                    var body = { messages: [{ role:'user', content: [{ type:'text', text:'Это документ (паспорт или ID-карта). Извлеки данные в JSON формате с ключами: surname (фамилия), name (имя), patronymic (отчество), dob (дата рождения ДД.ММ.ГГГГ), passport_series (серия), passport_number (номер), nationality (гражданство), gender (М/Ж). Если поле не видно — пиши null. ОТВЕТЬ ТОЛЬКО JSON, без пояснений.' },{ type:'image_url', image_url:{url:dataUrl} }] }], thinking:{type:'disabled'} };
                    var response = await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body)});
                    if(!response.ok)throw new Error('API returned '+response.status);
                    var data=await response.json();
                    var content=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
                    if(!content)throw new Error('Empty response');
                    var jsonStr=content;var jsonMatch=content.match(/```(?:json)?\s*([\s\S]*?)```/);
                    if(jsonMatch)jsonStr=jsonMatch[1].trim();
                    var jsonStart=jsonStr.indexOf('{');var jsonEnd=jsonStr.lastIndexOf('}');
                    if(jsonStart>=0&&jsonEnd>jsonStart)jsonStr=jsonStr.substring(jsonStart,jsonEnd+1);
                    var parsed=JSON.parse(jsonStr);
                    var result={fullName:[parsed.surname,parsed.name,parsed.patronymic].filter(Boolean).join(' '),dob:parsed.dob||'',passport:[parsed.passport_series,parsed.passport_number].filter(Boolean).join(' '),nationality:parsed.nationality||'',gender:parsed.gender||''};
                    if(result.nationality){var nat=result.nationality.toUpperCase();if(nat.indexOf('КЫРГЫЗ')>=0||nat.indexOf('KGZ')>=0||nat==='KG')result.nationality='КР';if(nat.indexOf('РОССИ')>=0||nat.indexOf('RUS')>=0||nat==='RU')result.nationality='РФ';if(nat.indexOf('КАЗАХ')>=0||nat==='KAZ')result.nationality='KZ';if(nat.indexOf('УЗБЕК')>=0||nat==='UZB')result.nationality='UZ';if(nat.indexOf('ТАДЖИК')>=0||nat==='TJK')result.nationality='TJ';}
                    return result;
                } catch(err){console.warn('AI Vision failed:',err.message);return null;}
            },

            // ═══ MAIN SCAN FUNCTION ═══

            scanPassport: async function (dataUrl, dotNetRef) {
                try {
                    if (dotNetRef) dotNetRef.invokeMethodAsync('OnOcrStatusChanged', 'scanning');
                    this.setProgress(2);
                    var aiResult = await this.scanWithAiVision(dataUrl);
                    if (aiResult && (aiResult.fullName || aiResult.passport)) {
                        console.log('OCR: AI Vision succeeded');
                        aiResult.method = 'ai-vision';
                        if (dotNetRef) dotNetRef.invokeMethodAsync('OnOcrStatusChanged', 'done');
                        this.setProgress(100);
                        return JSON.stringify(aiResult);
                    }
                    this.setProgress(3);
                    if (!this._tesseractLoaded) { await this.loadTesseract(); this.setProgress(5); }
                    this.setProgress(8);
                    var img = await this.loadImage(dataUrl);
                    this.setProgress(12);
                    var canvas1 = this.preprocessImage(img, { contrast: 70, binarize: true, maxWidth: 2400 });
                    var processedFull = this.canvasToDataUrl(canvas1);
                    this.setProgress(15);
                    var canvasMrz = this.cropRegion(img, { x:0, y:0.65, w:1, h:0.35 });
                    var canvasMrzProc = this.preprocessImage(canvasMrz, { contrast: 90, binarize: true, maxWidth: 3000 });
                    var processedMrz = this.canvasToDataUrl(canvasMrzProc);
                    var canvasTop = this.cropRegion(img, { x:0, y:0.15, w:0.7, h:0.45 });
                    var canvasTopProc = this.preprocessImage(canvasTop, { contrast: 50, binarize: true, maxWidth: 2400 });
                    var processedTop = this.canvasToDataUrl(canvasTopProc);
                    var worker = await this.getWorker();
                    this.setProgress(20);
                    var fullResult = await worker.recognize(processedFull);
                    this.setProgress(50);
                    var fullText = fullResult.data.text;
                    var mrzResult = await worker.recognize(processedMrz);
                    this.setProgress(75);
                    var mrzText = mrzResult.data.text;
                    var topResult = await worker.recognize(processedTop);
                    this.setProgress(90);
                    var topText = topResult.data.text;
                    var parsedFull = this.parsePassportText(fullText);
                    var parsedMrz = this.parseMrz(mrzText);
                    var parsedTop = this.parsePassportText(topText);
                    var merged = {
                        fullName: parsedTop.fullName || parsedFull.fullName || parsedMrz.fullName,
                        dob: parsedMrz.dob || parsedFull.dob || parsedTop.dob,
                        passport: parsedMrz.passport || parsedFull.passport,
                        nationality: parsedMrz.nationality || parsedFull.nationality || parsedTop.nationality,
                        gender: parsedMrz.gender || parsedFull.gender || parsedTop.gender,
                        method: 'tesseract-v2',
                        rawOcr: fullText
                    };
                    console.log('OCR merged:', merged);
                    if (dotNetRef) dotNetRef.invokeMethodAsync('OnOcrStatusChanged', 'done');
                    this.setProgress(100);
                    return JSON.stringify(merged);
                } catch (err) {
                    console.error('OCR error:', err);
                    if (dotNetRef) dotNetRef.invokeMethodAsync('OnOcrStatusChanged', 'error');
                    return JSON.stringify({ error: err.message || 'OCR failed' });
                }
            },

            terminate: function () {
                if (this._worker) { this._worker.terminate(); this._worker = null; }
            }
        };

        window.triggerAutoFillFlash = function () {
            var inputs = document.querySelectorAll('.form-group .input');
            inputs.forEach(function (inp) {
                if (inp.value && inp.value.length > 0) {
                    inp.classList.add('input-auto-filled');
                    setTimeout(function () { inp.classList.remove('input-auto-filled'); }, 1500);
                }
            });
        };
    </script>
</body>
