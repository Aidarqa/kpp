<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>КПП — Перенаправление...</title>
    <script>
        // SPA fallback for GitHub Pages:
        // GitHub Pages serves this file for any unknown URL (e.g. /kpp/login).
        // We save the requested path and redirect to the root where index.html loads Blazor.
        // After Blazor boots, it reads the saved path from sessionStorage and navigates to it.
        (function () {
            var base = document.querySelector('base');
            var baseHref = base ? base.getAttribute('href') : '/';
            // Get the path relative to base href
            var fullPath = window.location.pathname + window.location.search + window.location.hash;
            // Strip the base path prefix
            var relativePath = fullPath;
            if (baseHref !== '/' && fullPath.indexOf(baseHref) === 0) {
                relativePath = fullPath.substring(baseHref.length - 1); // keep leading /
            }
            if (relativePath && relativePath !== '/') {
                sessionStorage.setItem('kpp-redirect', relativePath);
            }
            window.location.replace(baseHref);
        })();
    </script>
</head>
<body></body>
</html>
