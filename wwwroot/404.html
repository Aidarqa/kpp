<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <base href="/kpp/" />
    <title>КПП — Перенаправление...</title>
    <script>
        // SPA fallback for GitHub Pages:
        // GitHub Pages serves this file for any unknown URL under /kpp/ (e.g. /kpp/login).
        // Save the requested path into sessionStorage and redirect to the root (/kpp/).
        // index.html loads Blazor, then App.razor reads the path and does NavigateTo.
        (function () {
            var fullPath = window.location.pathname + window.location.search + window.location.hash;
            // Strip the base prefix "/kpp/" to get the relative path (e.g. "/login")
            var base = '/kpp/';
            var relativePath = fullPath;
            if (fullPath.indexOf(base) === 0) {
                relativePath = '/' + fullPath.substring(base.length);
            }
            // Save and redirect to root
            if (relativePath && relativePath !== '/') {
                sessionStorage.setItem('kpp-redirect', relativePath);
            }
            window.location.replace(base);
        })();
    </script>
</head>
<body></body>
</html>
